# Minimal Dovecot config: this instance only ever talks to z-push over
# loopback inside the same container. It is NOT meant to be exposed
# externally - do not publish port 143/587 outside the container/pod.

protocols = imap submission

mail_location = maildir:/data/maildir

# Loopback only.
listen = 127.0.0.1, ::1

# Plaintext auth is acceptable here because this never leaves loopback.
disable_plaintext_auth = no
ssl = no

log_path = /dev/stderr
info_log_path = /dev/stdout

!include conf.d/*.conf
