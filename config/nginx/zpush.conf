server {
    listen 80 default_server;
    server_name _;
    root /usr/share/z-push;
    index index.php;

    client_max_body_size 50m;

    # Standard z-push rewrite: EAS clients hit /Microsoft-Server-ActiveSync
    location /Microsoft-Server-ActiveSync {
        rewrite ^/Microsoft-Server-ActiveSync(.*)$ /index.php$1 last;
    }

    location /autodiscover {
        rewrite ^/autodiscover(.*)$ /autodiscover/index.php$1 last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        include fastcgi_params;

        fastcgi_read_timeout 3660;
        fastcgi_send_timeout 3660;
        fastcgi_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
